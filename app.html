<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RAVEN App</title>
<meta name="theme-color" content="#06060A">
<link rel="icon" type="image/png" href="icon-1024.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#06060A;--panel:#101018;--panel2:#171724;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --white:#F5F1FF;--muted:#8A86A0;--soft:#D9C4FF;
  --purple:#A855F7;--violet:#C084FC;--green:#30D158;--blue:#58C7FF;--orange:#FFB86B;--red:#FF6B6B;
  --card-bg:linear-gradient(160deg,rgba(22,22,36,.95),rgba(10,10,18,.98));
}
html,body{height:100%;min-height:100%;font-family:Epilogue,system-ui,sans-serif;background:var(--black);color:var(--white);overflow:hidden}
body{min-height:100vh;padding:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(168,85,247,.22),transparent),
    radial-gradient(ellipse 60% 40% at 100% 60%,rgba(48,209,88,.10),transparent),
    #06060A;
  opacity:0;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease}
body.ready{opacity:1;transform:none}
body.leaving{opacity:0;transform:translateY(8px)}
button,input,textarea{font:inherit}

/* ── SPLASH ── */
.intro-splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(168,85,247,.22),transparent 60%),#06060A;
  animation:splashOut .8s 1s ease forwards}
.intro-r{width:min(52vw,240px);aspect-ratio:1;border-radius:32%;display:grid;place-items:center;position:relative;
  background:linear-gradient(145deg,#18182A,#08080E);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 80px rgba(168,85,247,.3),0 0 0 1px rgba(168,85,247,.08) inset;
  animation:rPop .75s cubic-bezier(.2,1.2,.32,1) both}
.intro-r::before{content:"R";font-family:"Bebas Neue";font-size:min(40vw,190px);line-height:.82;
  background:linear-gradient(175deg,#F8EEFF 10%,#C276FF 88%);-webkit-background-clip:text;color:transparent}
.intro-r::after{content:"";position:absolute;width:20%;aspect-ratio:1;border-radius:50%;bottom:10%;
  background:var(--green);box-shadow:0 0 28px rgba(48,209,88,.8)}

/* ── LOGIN SHELL ── */
.app-shell{min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 0;position:relative;isolation:isolate;overflow:hidden auto}
.app-shell-inner{padding:16px 20px 24px;display:flex;flex-direction:column;flex:1;gap:0}
.app-shell::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px;mask-image:linear-gradient(#000 0%,transparent 65%)}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo-mark{width:36px;height:36px;border-radius:12px;
  background:linear-gradient(145deg,#1C1C2E,#0A0A12);
  border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.3)}
.brand-logo-mark::before{content:"R";font-family:"Bebas Neue";font-size:28px;line-height:.8;
  background:linear-gradient(180deg,#F1DCFF,#B276FF);-webkit-background-clip:text;color:transparent}
.brand-logo-mark::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;
  background:var(--green);bottom:6px;right:9px;box-shadow:0 0 10px rgba(48,209,88,.8)}
.brand-name{font-family:"Bebas Neue";font-size:20px;letter-spacing:.18em;color:rgba(245,241,255,.9)}
.brand-tagline{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.08em}

/* ── HERO ── */
.hero{text-align:center;padding:8px 0 16px;display:flex;flex-direction:column;align-items:center}
.raven-stage{position:relative;width:min(38vw,168px);aspect-ratio:1;margin:0 auto 12px;display:grid;place-items:center}
.raven-glow{position:absolute;inset:0%;border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,.2) 0%,rgba(48,209,88,.08) 55%,transparent 75%);
  animation:breathe 4s ease-in-out infinite}
.raven-ring{position:absolute;inset:-8%;border-radius:50%;
  border:1px dashed rgba(192,132,252,.22);animation:spin 20s linear infinite}
.raven-ring2{position:absolute;inset:-18%;border-radius:50%;
  border:1px solid rgba(48,209,88,.08);animation:spin 32s linear infinite reverse}
.raven-wing{position:absolute;width:42%;height:28%;top:34%;
  background:linear-gradient(135deg,rgba(192,132,252,.9),rgba(137,92,246,.7));
  clip-path:polygon(0 45%,58% 0,100% 18%,68% 45%,100% 77%,58% 100%);opacity:.75}
.raven-wing.left{left:0;transform-origin:100% 50%;animation:wingLeft 2.6s ease-in-out infinite}
.raven-wing.right{right:0;transform:scaleX(-1);transform-origin:0 50%;animation:wingRight 2.6s ease-in-out infinite}
.raven-core{position:relative;width:56%;height:56%;border-radius:28%;
  background:linear-gradient(145deg,#1A1A2C,#08080E);
  border:1px solid rgba(255,255,255,.10);display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 60px rgba(124,58,237,.2)}
.raven-core::after{content:"";position:absolute;width:20%;aspect-ratio:1;border-radius:50%;
  bottom:9%;background:var(--green);box-shadow:0 0 20px rgba(48,209,88,.6)}
.raven-r{font-family:"Bebas Neue";font-size:clamp(52px,14vw,86px);line-height:.82;
  background:linear-gradient(175deg,#F0D8FF 5%,#B276FF 90%);-webkit-background-clip:text;color:transparent;margin-top:-2px}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--green);opacity:.6;animation:floatSpark 4.5s ease-in-out infinite}
.spark.s1{left:14%;top:16%}.spark.s2{right:16%;top:20%;background:var(--blue);animation-delay:.6s}.spark.s3{left:22%;bottom:16%;background:var(--violet);animation-delay:1.1s}
.hero-eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:6px;opacity:.8}
.hero h1{font-family:"Bebas Neue";font-size:clamp(44px,14vw,72px);letter-spacing:.03em;line-height:.86;margin:0}
.hero p{max-width:280px;margin:8px auto 0;color:var(--muted);font-size:12.5px;line-height:1.5}

/* ── FEATURE CHIPS ── */
.feature-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.g{color:var(--green);background:rgba(48,209,88,.07);border-color:rgba(48,209,88,.18)}
.chip.v{color:var(--violet);background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.18)}
.chip.b{color:var(--blue);background:rgba(88,199,255,.07);border-color:rgba(88,199,255,.18)}

/* ── AUTH CARD ── */
.auth-card{background:rgba(14,14,22,.9);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 0 1px rgba(168,85,247,.06) inset;backdrop-filter:blur(20px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:rgba(255,255,255,.04);padding:4px;border-radius:16px;margin-bottom:16px}
.tab{border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:13px;font-weight:800;padding:11px;cursor:pointer;transition:all .15s ease}
.tab.active{background:rgba(255,255,255,.92);color:#090910;box-shadow:0 6px 18px rgba(0,0,0,.24)}
.form{display:none;gap:11px}.form.active{display:grid}
.field{display:grid;gap:5px}
.label{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;border:1px solid rgba(255,255,255,.09);border-radius:13px;
  background:rgba(8,8,14,.9);color:var(--white);padding:13px 14px;outline:none;
  transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:rgba(192,132,252,.65);box-shadow:0 0 0 3px rgba(168,85,247,.12)}
.primary-btn{width:100%;border:0;border-radius:14px;
  background:linear-gradient(180deg,#46F08C 0%,#30D158 60%,#25AE49 100%);
  color:#041208;padding:15px 16px;font-weight:900;font-size:14px;cursor:pointer;
  box-shadow:0 12px 28px rgba(48,209,88,.26),0 0 0 1px rgba(0,0,0,.15) inset;
  transition:transform .12s,filter .12s}
.primary-btn:hover{filter:brightness(1.06)}
.primary-btn:active{transform:scale(.99)}
.primary-btn:disabled{opacity:.6;cursor:wait}
.secondary-btn{width:100%;border:1px solid rgba(255,255,255,.09);border-radius:14px;
  background:rgba(255,255,255,.04);color:var(--white);padding:13px 16px;font-weight:800;cursor:pointer;
  transition:background .15s}
.secondary-btn:hover{background:rgba(255,255,255,.07)}
.google-btn{width:100%;border:1px solid rgba(255,255,255,.18);border-radius:14px;
  background:#fff;color:#181820;padding:13px 16px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .15s}
.google-btn:hover{opacity:.92}
.google-btn svg{width:22px;height:22px;display:block;flex:0 0 auto}
.apple-btn{width:100%;border:1px solid rgba(255,255,255,.18);border-radius:14px;
  background:#000;color:#fff;padding:13px 16px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .15s;margin-top:10px}
.apple-btn:hover{opacity:.88}
.apple-btn svg{width:19px;height:19px;display:block;flex:0 0 auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tiny{font-size:11.5px;color:var(--muted);line-height:1.5}
.link-btn{border:0;background:transparent;color:var(--soft);font-size:12px;font-weight:800;cursor:pointer}
.error,.success{display:none;border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.45;margin-bottom:10px}
.error{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.22);color:#FFB3B3}
.success{background:rgba(48,209,88,.08);border:1px solid rgba(48,209,88,.22);color:#A7F3B7}
.auth-card.confirm-mode{padding:26px 18px;text-align:center}
.email-confirm-panel{display:grid;gap:18px;justify-items:center}
.email-confirm-icon{font-size:46px;line-height:1}
.email-confirm-title{font-size:24px;font-weight:900;color:var(--white);line-height:1.15}
.email-confirm-copy{font-size:15px;line-height:1.7;color:var(--muted);margin:0;max-width:310px}
.email-confirm-copy strong{color:var(--white);font-weight:900;word-break:break-word}
.email-confirm-ok{width:100%;border:1px solid rgba(48,209,88,.28);border-radius:16px;background:rgba(48,209,88,.08);color:var(--green);font-size:15px;font-weight:800;line-height:1.45;padding:15px}
.email-confirm-back{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px}

/* ── APP HOME (signed-in scan screen) ── */
.app-home{display:none;height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 50% at 50% 0%,rgba(168,85,247,.22),transparent 55%),
    radial-gradient(ellipse 60% 40% at 20% 100%,rgba(48,209,88,.12),transparent 50%),
    linear-gradient(180deg,#07070D 0%,#0C0C16 100%);
  overscroll-behavior:none;touch-action:manipulation}
.app-home.active{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column}

/* top bar */
.home-top{display:none}
.home-brand{display:flex;align-items:center;gap:10px}
.home-logo{width:40px;height:40px;border-radius:14px;
  background:linear-gradient(145deg,#1C1C2E,#08080E);
  border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;position:relative;
  box-shadow:0 10px 28px rgba(0,0,0,.3)}
.home-logo::before{content:"R";font-family:"Bebas Neue";font-size:32px;line-height:.82;
  background:linear-gradient(180deg,#F1DCFF,#B276FF);-webkit-background-clip:text;color:transparent}
.home-logo::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;
  background:var(--green);bottom:6px;right:9px;box-shadow:0 0 12px rgba(48,209,88,.8)}
.home-title{font-family:"Bebas Neue";font-size:28px;letter-spacing:.15em}
.home-sub{display:none}
.home-profile{display:none}

/* signed-out bottom bar */
.auth-actions{display:none;width:100%;gap:10px}
.app-home.signed-out .dashboard-pill{display:none!important}
.app-home.signed-out .auth-actions{display:flex!important}
.app-home.signed-out #home-profile-btn{display:none!important}
.app-home:not(.signed-out) .auth-actions{display:none!important}
.app-home:not(.signed-out) .dashboard-pill{display:flex!important}

/* scan section */
.scan-hero{flex:1;min-height:0;display:flex;align-items:stretch}
.scan-card{width:100%;height:100%;min-height:0;border:0;border-radius:0;background:transparent;box-shadow:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:clamp(10px,2.5vh,26px) clamp(18px,6vw,32px) 10px;position:relative;overflow:hidden}
.scan-card::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(#000 0%,transparent 75%);pointer-events:none}
.scan-card::after{content:"";position:absolute;inset:-40%;
  background:radial-gradient(circle at 42% 32%,rgba(48,209,88,.09),transparent 42%),radial-gradient(circle at 68% 62%,rgba(168,85,247,.12),transparent 46%);
  filter:blur(20px);opacity:.9;pointer-events:none;animation:scanGlow 7s ease-in-out infinite}
.scan-card{transform:translateZ(0)}

.scan-orbit{position:relative;width:clamp(148px,24vh,220px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin-bottom:clamp(12px,2.5vh,24px);flex:0 0 auto;pointer-events:none}
.scan-orbit::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(192,132,252,.28);animation:spin 18s linear infinite}
.scan-orbit::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px solid rgba(48,209,88,.07);animation:spin 28s linear infinite reverse}
.scan-logo-button{width:58%;aspect-ratio:1;border:0;border-radius:28%;background:transparent;
  display:grid;place-items:center;padding:0;position:relative;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;pointer-events:auto}
#home-logo-btn,.scan-logo-button{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#home-logo-btn *, .scan-logo-button *{pointer-events:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.scan-mark{width:100%;height:100%;border-radius:28%;
  background:linear-gradient(148deg,#1C1C2E,#08080E);
  border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;position:relative;
  box-shadow:0 20px 56px rgba(168,85,247,.24),0 0 0 1px rgba(168,85,247,.06) inset;
  transition:transform .14s ease,box-shadow .14s ease}
.scan-mark::before{content:"";position:absolute;inset:-28%;border-radius:50%;background:radial-gradient(circle,rgba(48,209,88,.12),transparent 62%);z-index:-1}
.scan-mark::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--green);left:50%;bottom:10%;transform:translateX(-50%);box-shadow:0 0 22px rgba(48,209,88,.8)}
.scan-mark span{font-family:"Bebas Neue";font-size:min(27vw,124px);line-height:.82;background:linear-gradient(175deg,#F1DCFF,#B276FF);-webkit-background-clip:text;color:transparent}
.scan-logo-button:active .scan-mark{transform:scale(.97);box-shadow:0 14px 44px rgba(168,85,247,.2)}
.scan-logo-button:focus-visible{outline:none}
.scan-logo-button:focus-visible .scan-mark{box-shadow:0 20px 56px rgba(168,85,247,.26),0 0 0 4px rgba(48,209,88,.2)}
.scan-logo-button.is-launching .scan-mark{animation:scanLogoLaunch .42s cubic-bezier(.2,.9,.18,1) forwards}
.scan-logo-button.is-launching::before{content:"";position:absolute;inset:-34%;border-radius:50%;border:2px solid rgba(48,209,88,.42);animation:scanLogoRipple .46s ease-out forwards}
.scan-logo-button.is-launching::after{content:"";position:absolute;inset:-16%;border-radius:50%;background:radial-gradient(circle,rgba(48,209,88,.18),rgba(168,85,247,.12) 45%,transparent 70%);animation:scanLogoFlash .46s ease-out forwards;z-index:-1}
.home-logo.is-launching{animation:scanLogoLaunch .42s cubic-bezier(.2,.9,.18,1) forwards}
.home-logo.is-launching::after{box-shadow:0 0 22px rgba(48,209,88,1)}
.scan-orbit,.scan-title,.scan-copy{position:relative;z-index:1}

/* scan title + instruction */
.scan-title{font-family:"Bebas Neue";font-size:clamp(46px,9.5vh,76px);letter-spacing:.03em;line-height:.88;margin-bottom:clamp(8px,1.4vh,14px);text-shadow:0 12px 36px rgba(0,0,0,.3);flex:0 0 auto}
.scan-copy{display:none}
.scan-instruction{position:relative;z-index:1;max-width:300px;margin-top:4px;color:rgba(245,241,255,.5);font-size:12px;line-height:1.5;flex:0 0 auto}
.scan-status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;
  background:rgba(48,209,88,.08);border:1px solid rgba(48,209,88,.18);
  font-size:11px;font-weight:700;color:var(--green);margin-top:12px;flex:0 0 auto;position:relative;z-index:1}
.app-home .scan-status-pill{display:none}
.scan-status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(48,209,88,.8);animation:breathe 2s ease-in-out infinite}

/* auth dock */
.app-auth-dock{position:relative;z-index:2;width:100%;max-width:360px;margin-top:10px;display:none;flex:0 1 auto;min-height:0}
.app-home.auth-visible .app-auth-dock{display:block}
.app-home.auth-visible .scan-orbit{width:clamp(108px,16vh,148px);margin-bottom:8px}
.app-home.auth-visible .scan-title{font-size:clamp(30px,5.5vh,44px);margin-bottom:6px}
.app-home.auth-visible .scan-copy,.app-home.auth-visible .scan-instruction,.app-home.auth-visible .scan-status-pill{display:none}
.app-home .auth-card{width:100%;max-height:none;overflow:visible;padding:12px;border-radius:20px}
.app-home .auth-card.confirm-mode{padding:24px 18px;border-radius:20px}
.app-home .tabs{margin-bottom:10px}
.app-home .form{gap:9px}
.app-home .input{padding:11px 12px}
.app-home .primary-btn,.app-home .secondary-btn{padding:12px 12px}
.app-home .google-btn{min-height:56px;padding:14px 14px;border-radius:17px;font-size:16px}
.app-home .apple-btn{min-height:56px;padding:14px 14px;border-radius:17px;font-size:16px}
.app-home .tiny{font-size:11px}
/* When the full sign-in/create form is open, let it scroll instead of being
   clipped by the centered/hidden-overflow scan-card, and hide the redundant
   compact Sign in / Create account bar so the form gets the full height. */
.app-home.auth-visible .scan-hero{overflow-y:auto;-webkit-overflow-scrolling:touch}
.app-home.auth-visible .scan-card{overflow-y:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;padding-bottom:24px}
.app-home.auth-visible .app-cta-bottom{display:none}

/* raven flight animation */
.raven-flight{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.flight-raven{position:absolute;left:-64px;top:var(--fly-y);width:46px;height:26px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));animation:ravenFly .62s cubic-bezier(.2,.74,.28,1) forwards}
.flight-raven::before,.flight-raven::after{content:"";position:absolute;top:6px;width:26px;height:16px;background:linear-gradient(135deg,#151522,#08080F);clip-path:polygon(0 55%,65% 0,100% 26%,72% 55%,100% 86%,65% 100%);animation:flyWing .18s ease-in-out infinite}
.flight-raven::before{left:0;transform-origin:100% 50%}
.flight-raven::after{right:0;transform:scaleX(-1);transform-origin:0 50%;animation-name:flyWingRight}
.flight-raven span{position:absolute;left:17px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--green);box-shadow:0 0 16px rgba(48,209,88,.8)}

/* bottom CTA */
.app-cta-bottom{position:relative;z-index:3;flex:0 0 auto;width:100%;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(7,7,13,.0),rgba(7,7,13,.98) 30%);
  box-shadow:none}
.dashboard-pill{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;
  padding:14px 18px;border:0;border-radius:18px;
  background:linear-gradient(180deg,#46F08C 0%,#30D158 60%,#25AE49 100%);
  font-size:15px;font-weight:900;color:#041208;
  box-shadow:0 12px 32px rgba(48,209,88,.28),0 0 0 1px rgba(0,0,0,.15) inset;
  cursor:pointer;transition:filter .12s,transform .12s;letter-spacing:.01em}
.dashboard-pill:hover{filter:brightness(1.06)}
.dashboard-pill:active{transform:scale(.99)}
.auth-action{min-height:48px;border:0;border-radius:15px;background:var(--green);color:#041208;
  font-size:13px;font-weight:900;cursor:pointer;flex:1;
  box-shadow:0 10px 24px rgba(48,209,88,.2);transition:filter .12s}
.auth-action.secondary{background:rgba(255,255,255,.07);color:var(--white);
  border:1px solid rgba(255,255,255,.12);box-shadow:none}

/* nav tabs */
.home-tabs{display:none !important}
.home-tabs.active{display:grid !important;grid-template-columns:repeat(4,1fr)}
.home-tab{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;gap:4px;
  font-size:10.5px;font-weight:700;cursor:pointer;padding:8px 4px;border-radius:14px;
  transition:color .15s,background .15s}
.home-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.home-tab.active{color:var(--green)}
.home-tab.active svg{filter:drop-shadow(0 0 6px rgba(48,209,88,.4))}

/* loading */
.loading{position:fixed;inset:0;background:rgba(6,6,10,.88);display:none;place-items:center;z-index:20;backdrop-filter:blur(16px)}
.loading.show{display:grid}
.loader-mark{width:80px;height:80px;border-radius:26px;background:linear-gradient(145deg,#1C1C2E,#08080E);
  border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;
  animation:loaderPulse 1.3s ease-in-out infinite}
.loader-mark span{font-family:"Bebas Neue";font-size:58px;background:linear-gradient(#F0D8FF,#B276FF);-webkit-background-clip:text;color:transparent}

/* nav bar container */
#home-tabs-wrap{flex:0 0 auto;padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  background:rgba(8,8,14,.94);border-top:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(20px)}

@keyframes breathe{0%,100%{transform:scale(.93);opacity:.65}50%{transform:scale(1.10);opacity:1}}
@keyframes wingLeft{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(14deg) translateY(-9px)}}
@keyframes wingRight{0%,100%{transform:scaleX(-1) rotate(-8deg) translateY(0)}50%{transform:scaleX(-1) rotate(14deg) translateY(-9px)}}
@keyframes floatSpark{0%,100%{transform:translateY(0) scale(.8);opacity:.35}50%{transform:translateY(-16px) scale(1.2);opacity:.9}}
@keyframes popIn{from{transform:translateY(14px) scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes loaderPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(168,85,247,0)}50%{transform:scale(1.05);box-shadow:0 0 40px rgba(168,85,247,.3)}}
@keyframes scanGlow{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-14px);opacity:1}}
@keyframes scanLogoLaunch{0%{transform:scale(1)}42%{transform:scale(.9) rotate(-2deg);box-shadow:0 10px 34px rgba(48,209,88,.22),0 0 0 1px rgba(48,209,88,.14) inset}100%{transform:scale(1.13) rotate(1deg);box-shadow:0 24px 74px rgba(48,209,88,.34),0 0 0 1px rgba(48,209,88,.22) inset}}
@keyframes scanLogoRipple{0%{transform:scale(.72);opacity:.85}100%{transform:scale(1.28);opacity:0}}
@keyframes scanLogoFlash{0%{transform:scale(.72);opacity:0}40%{opacity:1}100%{transform:scale(1.2);opacity:0}}
@keyframes ravenFly{0%{transform:translateX(0) translateY(18px) scale(.85);opacity:0}12%{opacity:1}100%{transform:translateX(calc(100vw + 110px)) translateY(-22px) scale(1.08);opacity:0}}
@keyframes flyWing{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(20deg)}}
@keyframes flyWingRight{0%,100%{transform:scaleX(-1) rotate(-18deg)}50%{transform:scaleX(-1) rotate(20deg)}}
@keyframes rPop{0%{transform:scale(.3) rotate(-10deg);opacity:0}65%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@media(max-height:700px){
  .raven-stage{width:min(28vw,120px)}
  .hero h1{font-size:36px}
  .hero p,.feature-chips{display:none}
  .auth-card{padding:13px}
  .form{gap:8px}
  .input{padding:11px 12px}
  .primary-btn{padding:12px}
  .scan-orbit{width:clamp(118px,20vh,150px);margin-bottom:8px}
  .scan-title{font-size:clamp(38px,8vh,56px)}
  .dashboard-pill{min-height:46px}
}
@media(max-height:600px){.hero .raven-stage,.spark{display:none}.hero h1{font-size:32px}}
@media(min-height:900px){.scan-orbit{width:clamp(180px,26vh,250px)}.scan-title{font-size:clamp(56px,11vh,88px)}}
@media(min-width:760px){.app-shell{max-width:460px;margin:0 auto}.raven-stage{width:220px}}

<script>
window.RAVEN_SCAN_URL = 'dashboard.html?app=1&page=create-bill';
window.animateScanLogo = window.animateScanLogo || function animateScanLogo(source){
  const target = source && source.closest ? source.closest('#home-logo-btn,.scan-logo-button') : null;
  const logo = target || document.querySelector('.scan-logo-button') || document.getElementById('home-logo-btn');
  if (logo) {
    logo.classList.remove('is-launching');
    void logo.offsetWidth;
    logo.classList.add('is-launching');
  }
  try { if (navigator.vibrate) navigator.vibrate(18); } catch(e) {}
};
window.goScanPage = window.goScanPage || function goScanPage(source){
  if (isRavenSignedOut() || !hasRavenCachedIdentity()) {
    showSignedOutHome();
    showAuthPanel('login');
    showMessage('error', 'Sign in to scan a receipt.');
    return false;
  }
  if (window.goScanPage._navigating) return false;
  window.goScanPage._navigating = true;
  try { localStorage.setItem('raven_native_app','1'); } catch(e) {}
  window.animateScanLogo(source);
  setTimeout(() => { window.location.href = window.RAVEN_SCAN_URL; }, 430);
  setTimeout(() => {
    try { window.location.replace(window.RAVEN_SCAN_URL); } catch(e) {}
  }, 760);
  return false;
};
window.scanLogoAction = window.scanLogoAction || function scanLogoAction(event){
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  return window.goScanPage(event?.currentTarget || event?.target);
};
const SUPABASE_URL = 'https://ffjpzkpdumdcwnakpaje.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmanB6a3BkdW1kY3duYWtwYWplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5ODc4OTcsImV4cCI6MjA4ODU2Mzg5N30.JtDLVu4K1TJ8emcN_mvSHBu6e0y8-jPQv-ypoc9p0RU';
const BACKEND = 'https://raven-backend-production-fb1f.up.railway.app';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    flowType: 'implicit',
    detectSessionInUrl: true,
    persistSession: true,
    autoRefreshToken: true
  }
});
let pendingConfirmEmail = '';
const RAVEN_SIGNED_OUT_KEY = 'raven_signed_out';
const RAVEN_GOOGLE_AUTH_KEY = 'raven_google_auth_in_progress';
const RAVEN_APPLE_AUTH_KEY = 'raven_apple_auth_in_progress';
const RAVEN_SIGNUP_AUTH_KEY = 'raven_signup_auth_in_progress';
let ravenAuthRouting = false;

function el(id){return document.getElementById(id)}
function clearRavenSignedInCache(){
  try { localStorage.setItem(RAVEN_SIGNED_OUT_KEY, '1'); } catch(e) {}
  [
    'raven_profile',
    'raven_app_dashboard_email',
    'raven_native_app',
    'raven_trip_name'
  ].forEach(key => { try { localStorage.removeItem(key); } catch(e) {} });
  try {
    Object.keys(localStorage).forEach(key => {
      if (/supabase|auth-token|sb-/i.test(key)) localStorage.removeItem(key);
      if (/^raven_bill_name_|^raven_bill_claim_as_/i.test(key)) localStorage.removeItem(key);
    });
  } catch(e) {}
  try {
    Object.keys(sessionStorage).forEach(key => {
      if (/raven_profile|raven_trip_name|supabase|auth-token|sb-/i.test(key)) sessionStorage.removeItem(key);
    });
  } catch(e) {}
}
function isRavenSignedOut(){
  try { return localStorage.getItem(RAVEN_SIGNED_OUT_KEY) === '1'; } catch(e) { return false; }
}
function markRavenSignedIn(){
  try { localStorage.removeItem(RAVEN_SIGNED_OUT_KEY); } catch(e) {}
}
function markFreshAuthStart(key){
  const value = String(Date.now());
  try { sessionStorage.setItem(key, value); } catch(e) {}
  try { localStorage.setItem(key, value); } catch(e) {}
}
function hasFreshAuthStart(){
  const now = Date.now();
  return [RAVEN_GOOGLE_AUTH_KEY, RAVEN_APPLE_AUTH_KEY, RAVEN_SIGNUP_AUTH_KEY].some(key => {
    const value = Number(sessionStorage.getItem(key) || localStorage.getItem(key) || 0);
    return value && now - value < 10 * 60 * 1000;
  });
}
function clearFreshAuthStart(){
  [RAVEN_GOOGLE_AUTH_KEY, RAVEN_APPLE_AUTH_KEY, RAVEN_SIGNUP_AUTH_KEY].forEach(key => {
    try { sessionStorage.removeItem(key); } catch(e) {}
    try { localStorage.removeItem(key); } catch(e) {}
  });
}
async function consumeImplicitAuthFromUrl(){
  try {
    const hash = window.location.hash || '';
    if (!hash || !hash.includes('access_token=')) return null;
    const params = new URLSearchParams(hash.replace(/^#/, ''));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    if (!access_token || !refresh_token) return null;
    const { data, error } = await db.auth.setSession({ access_token, refresh_token });
    if (error) throw error;
    return data?.session || null;
  } catch(e) {
    console.warn('consumeImplicitAuthFromUrl failed:', e);
    return null;
  }
}
function clearAppIdentityForAuthSwitch(){
  [
    'raven_profile',
    'raven_app_dashboard_email',
    'raven_trip_name'
  ].forEach(key => { try { localStorage.removeItem(key); } catch(e) {} });
  try {
    Object.keys(localStorage).forEach(key => {
      if (/supabase|auth-token|sb-/i.test(key)) localStorage.removeItem(key);
    });
  } catch(e) {}
  try {
    Object.keys(sessionStorage).forEach(key => {
      if (/raven_profile|raven_trip_name|supabase|auth-token|sb-|raven_auth/i.test(key)) sessionStorage.removeItem(key);
    });
  } catch(e) {}
}
function hasRavenCachedIdentity(){
  try {
    const local = JSON.parse(localStorage.getItem('raven_profile') || '{}');
    const appEmail = String(localStorage.getItem('raven_app_dashboard_email') || '').trim();
    return !!(local.user_id || local.id || local.email || local.first_name || local.raven_id || local.username || local.avatar_url || appEmail);
  } catch(e) {
    return false;
  }
}

function isNativeAppMode(){
  try {
    if (window.Capacitor?.isNativePlatform && window.Capacitor.isNativePlatform()) return true;
    const params = new URLSearchParams(window.location.search);
    if (params.get('app') === '1') return true;
    return localStorage.getItem('raven_native_app') === '1';
  } catch(e) {
    return false;
  }
}
function getAppAuthRedirectTo(){
  // Supabase performs the final redirect hop itself (Google/Apple only ever
  // see Supabase's own https callback), so a custom scheme is safe here even
  // though it wouldn't be for a URI handed directly to an OAuth provider.
  // Using it lets iOS fire the appUrlOpen deep-link listener the instant the
  // OAuth flow finishes, which closes the in-app browser (Browser.close())
  // immediately instead of leaving the Safari-style chrome sitting on screen.
  return 'ravensplit://auth/callback?app=1';
}
function getAppPasswordResetRedirectTo(){
  // Use the HTTPS app page for recovery links. Custom schemes can open as a
  // blank page on desktop mail clients, while HTTPS works in Safari, PWA, and
  // can still be handed to the native app by Universal Links later.
  return 'https://ravensplit.com/app.html?app=1&reset=1';
}
function getAppConfirmRedirectTo(){
  return 'https://ravensplit.com/app.html?app=1';
}
function handleNativeAuthCallbackUrl(url){
  try {
    try { window.Capacitor?.Plugins?.Browser?.close?.(); } catch(_) {}
    try { localStorage.removeItem(RAVEN_SIGNED_OUT_KEY); } catch(_) {}
    const incoming = new URL(url);
    const isRavenAuth = incoming.protocol === 'ravensplit:' && incoming.hostname === 'auth';
    if (!isRavenAuth && !/\/app\.html|\/dashboard\.html/.test(incoming.pathname)) return false;
    const hash = incoming.hash || '';
    const isReset = incoming.pathname.includes('reset') || incoming.searchParams.get('reset') === '1' || incoming.searchParams.get('type') === 'recovery' || hash.includes('type=recovery');
    const params = new URLSearchParams();
    params.set('app', '1');
    if (isReset) params.set('reset', '1');
    ['code','error','error_description','type'].forEach(key => {
      const value = incoming.searchParams.get(key);
      if (value) params.set(key, value);
    });
    const target = 'app.html?' + params.toString() + hash;
    window.location.replace(target);
    return true;
  } catch(e) {
    return false;
  }
}
function showPasswordResetFormFromUrl(url){
  try {
    const incoming = new URL(url || window.location.href, window.location.href);
    const hash = incoming.hash || '';
    const query = incoming.search || '?app=1&reset=1';
    if (!/reset=1/.test(query) && !/type=recovery/.test(hash)) return false;
    const target = 'app.html?app=1&reset=1' + hash;
    if (hash && window.location.href.indexOf(target) === -1) {
      window.location.href = target;
      return true;
    }
    try { db.auth.getSession(); } catch(e) {}
    history.replaceState(null, '', window.location.pathname + '?app=1&reset=1');
    showSignedOutHome();
    showTab('new-password');
    return true;
  } catch(e) {
    return false;
  }
}
async function preparePasswordResetFromUrl(url){
  try {
    const incoming = new URL(url || window.location.href, window.location.href);
    const hash = incoming.hash || '';
    const isReset = incoming.searchParams.get('reset') === '1' || incoming.searchParams.get('type') === 'recovery' || hash.includes('type=recovery');
    if (!isReset) return false;
    const code = incoming.searchParams.get('code');
    if (code) {
      const { error } = await db.auth.exchangeCodeForSession(code);
      if (error) throw error;
    } else if (hash.includes('access_token=')) {
      await consumeImplicitAuthFromUrl();
      try { await db.auth.getSession(); } catch(e) {}
    }
    history.replaceState(null, '', window.location.pathname + '?app=1&reset=1');
    showSignedOutHome();
    showTab('new-password');
    return true;
  } catch(e) {
    showSignedOutHome();
    showTab('reset');
    showMessage('error', 'That reset link could not be opened. Send yourself a fresh reset link and try again.');
    return true;
  }
}
function setupNativeAppUrlListener(){
  const appPlugin = window.Capacitor?.Plugins?.App;
  if (!appPlugin?.addListener || setupNativeAppUrlListener._ready) return;
  setupNativeAppUrlListener._ready = true;
  if (appPlugin.getLaunchUrl) {
    appPlugin.getLaunchUrl().then(result => {
      const url = result?.url || '';
      if (!url) return;
      if (handleNativeAuthCallbackUrl(url)) return;
      if (url.includes('/app.html') || url.includes('/dashboard.html') || url.indexOf('ravensplit://auth/') === 0) {
        preparePasswordResetFromUrl(url);
      }
    }).catch(() => {});
  }
  appPlugin.addListener('appUrlOpen', ({ url }) => {
    if (!url) return;
    if (handleNativeAuthCallbackUrl(url)) return;
    if (url.includes('/app.html') || url.includes('/dashboard.html') || url.indexOf('ravensplit://auth/') === 0) {
      preparePasswordResetFromUrl(url);
    }
  });
}

async function recoverPendingNativeAuth(reason){
  if (!isNativeAppMode() || !hasFreshAuthStart() || ravenAuthRouting) return;
  try {
    const { data } = await db.auth.getSession();
    const user = data?.session?.user;
    if (!user) return;
    try { window.Capacitor?.Plugins?.Browser?.close?.(); } catch(_) {}
    markRavenSignedIn();
    routeAfterAuth(user);
  } catch(e) {
    console.warn('native auth resume recovery failed:', reason, e);
  }
}

function sanitizeRavenBase(base){
  return (String(base || '').trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,16) || 'raven';
}
async function generateUniqueRavenId(base, excludeUserId){
  const clean = sanitizeRavenBase(base);
  for (let i = 0; i < 40; i++) {
    const candidate = (clean + String(Math.floor(Math.random() * 900) + 100)).slice(0,20);
    let query = db.from('profiles').select('id').eq('raven_id', candidate);
    if (excludeUserId) query = query.neq('id', excludeUserId);
    const { data } = await query.maybeSingle();
    if (!data) return candidate;
  }
  return (clean + Date.now().toString().slice(-3)).slice(0,20);
}
async function routeAfterAuth(user){
  if (!user?.id) {
    showLoading(false);
    showSignedOutHome();
    return;
  }
  if (ravenAuthRouting === user.id) return;
  ravenAuthRouting = user.id;
  showLoading(true);
  try {
    const { data: profile } = await db.from('profiles').select('onboarding_complete,first_name,raven_id,username,avatar_url').eq('id', user.id).maybeSingle();
    if (profile?.onboarding_complete) {
      try { localStorage.setItem('raven_app_dashboard_email', user.email || ''); } catch(e) {}
      localStorage.setItem('raven_profile', JSON.stringify({
        user_id: user.id,
        email: user.email,
        first_name: profile.first_name || '',
        raven_id: profile.raven_id || profile.username || '',
        username: profile.username || profile.raven_id || '',
        avatar_url: profile.avatar_url || '',
        onboarding_complete: true
      }));
      showLoading(false);
      ravenAuthRouting = false;
      clearFreshAuthStart();
      showAppHome(profile);
      return;
    }
    // Route anyone without a completed profile through onboarding — this is
    // how first- and last-name (and everything else onboarding collects) get
    // set. Previously this silently patched onboarding_complete to true and
    // dropped new users straight on the dashboard with a blank profile.
    if (!profile?.onboarding_complete) {
      try { if (user.email) localStorage.setItem('raven_app_dashboard_email', user.email); } catch(e) {}
      const cached = getCachedAppProfile();
      const cachedMatchesUser = cached && (
        (cached.user_id && cached.user_id === user.id) ||
        (cached.email && user.email && String(cached.email).toLowerCase() === String(user.email).toLowerCase())
      );
      localStorage.setItem('raven_profile', JSON.stringify({
        user_id: user.id,
        email: user.email || '',
        first_name: profile?.first_name || (cachedMatchesUser ? cached?.first_name : '') || '',
        raven_id: profile?.raven_id || profile?.username || '',
        username: profile?.username || profile?.raven_id || '',
        avatar_url: profile?.avatar_url || '',
        onboarding_complete: false
      }));
      showLoading(false);
      ravenAuthRouting = false;
      clearFreshAuthStart();
      window.location.href = 'dashboard.html?app=1&page=overview';
      return;
    }
    const cached = getCachedAppProfile();
    const cachedMatchesUser = cached && (
      (cached.user_id && cached.user_id === user.id) ||
      (cached.email && user.email && String(cached.email).toLowerCase() === String(user.email).toLowerCase())
    );
    try { if (user.email) localStorage.setItem('raven_app_dashboard_email', user.email); } catch(e) {}
    localStorage.setItem('raven_profile', JSON.stringify({
      ...(cachedMatchesUser ? cached : {}),
      user_id: user.id,
      email: user.email || '',
      first_name: profile?.first_name || (cachedMatchesUser ? cached?.first_name : '') || '',
      raven_id: profile?.raven_id || profile?.username || (cachedMatchesUser ? cached?.raven_id : '') || '',
      username: profile?.username || profile?.raven_id || (cachedMatchesUser ? cached?.username : '') || '',
      avatar_url: profile?.avatar_url || (cachedMatchesUser ? cached?.avatar_url : '') || '',
      onboarding_complete: true
    }));
    showLoading(false);
    ravenAuthRouting = false;
    clearFreshAuthStart();
    showAppHome(profile || cached || {});
  } catch(e) {
    showLoading(false);
    ravenAuthRouting = false;
    // Best-effort: show app home even on error
    const cached = getCachedAppProfile();
    localStorage.setItem('raven_profile', JSON.stringify({
      ...(cached || {}),
      user_id: user.id,
      email: user.email || '',
      onboarding_complete: true
    }));
    showAppHome(cached || {});
  }
}
function getCachedAppProfile(){
  if (isRavenSignedOut()) return null;
  try {
    const local = JSON.parse(localStorage.getItem('raven_profile') || '{}');
    if (local && (local.user_id || local.email || local.first_name || local.raven_id || local.username)) return local;
  } catch(e) {}
  return null;
}

async function goDashboard(){
  localStorage.setItem('raven_native_app','1');
  if (isRavenSignedOut()) {
    showSignedOutHome();
    showAuthPanel('login');
    showMessage('error', 'Please sign in to open your dashboard.');
    return false;
  }
  showLoading(true);
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session?.user) {
      showLoading(false);
      showSignedOutHome();
      showAuthPanel('login');
      showMessage('error', 'Please sign in to open your dashboard.');
      return false;
    }
    markRavenSignedIn();
    try { if (session.user.email) localStorage.setItem(APP_DASHBOARD_EMAIL_KEY, session.user.email); } catch(e) {}
    const { data: profile } = await db.from('profiles').select('onboarding_complete,first_name,last_name,email,raven_id,username,avatar_url').eq('id', session.user.id).maybeSingle();
    const cached = getCachedAppProfile();
    const cachedMatches = cached && (
      cached.user_id === session.user.id ||
      cached.id === session.user.id ||
      (cached.email && session.user.email && String(cached.email).toLowerCase() === String(session.user.email).toLowerCase())
    );
    // Always go to dashboard — patch onboarding_complete if needed so it doesn't redirect back
    if (profile && !profile.onboarding_complete) {
      try { await db.from('profiles').update({ onboarding_complete: true }).eq('id', session.user.id); } catch(e) {}
    }
    localStorage.setItem('raven_profile', JSON.stringify({
      ...(cachedMatches ? cached : {}),
      ...(profile || {}),
      user_id: session.user.id,
      email: profile?.email || session.user.email || cached?.email || '',
      username: profile?.username || profile?.raven_id || cached?.username || cached?.raven_id || '',
      onboarding_complete: true
    }));
    navigateWithRavens('dashboard.html?app=1&page=overview');
    return false;
  } catch(e) {
    showLoading(false);
    showAuthPanel('login');
    showMessage('error', 'Could not verify your session. Please sign in again.');
    return false;
  }
}

function handleCameraCapture(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      sessionStorage.setItem('raven_scan_image', e.target.result);
      sessionStorage.setItem('raven_scan_type', file.type || 'image/jpeg');
    } catch(err) { /* sessionStorage full — dashboard will open picker as fallback */ }
    localStorage.setItem('raven_native_app','1');
    navigateWithFade('dashboard.html?app=1&page=create-bill');
  };
  reader.onerror = function(){
    localStorage.setItem('raven_native_app','1');
    navigateWithFade('dashboard.html?app=1&page=create-bill');
  };
  reader.readAsDataURL(file);
}

async function handleGoogleAuth(){
  if (handleGoogleAuth._busy) return;
  handleGoogleAuth._busy = true;
  clearMessage();
  showLoading(true);
  try {
    const redirectTo = getAppAuthRedirectTo();
    localStorage.setItem('raven_native_app','1');
    clearAppIdentityForAuthSwitch();
    try { await db.auth.signOut(); } catch(e) {}
    try { localStorage.removeItem(RAVEN_SIGNED_OUT_KEY); } catch(e) {}
    markFreshAuthStart(RAVEN_GOOGLE_AUTH_KEY);
    const { data, error } = await db.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo,
        skipBrowserRedirect: true,
        queryParams: { prompt: 'select_account' }
      }
    });
    if (error) {
      showLoading(false);
      showMessage('error', error.message);
      handleGoogleAuth._busy = false;
      return;
    }
    if (data?.url) {
      const capBrowser = window.Capacitor?.Plugins?.Browser;
      if (capBrowser?.open) {
        await capBrowser.open({ url: data.url, presentationStyle: 'fullscreen' });
      } else {
        window.location.href = data.url;
      }
      return;
    }
    showLoading(false);
    showMessage('error', 'Google sign-in did not open. Please try again.');
  } catch(e) {
    showLoading(false);
    showMessage('error', 'Google sign-in failed. Please try email/password.');
  } finally {
    setTimeout(() => { handleGoogleAuth._busy = false; }, 1200);
  }
}
async function handleAppleAuth(){

    if (error) {
      showLoading(false);
      showMessage('error', error.message);
      handleAppleAuth._busy = false;
      return;
    }
    if (data?.url) {
      const capBrowser = window.Capacitor?.Plugins?.Browser;
      if (capBrowser?.open) {
        await capBrowser.open({ url: data.url, presentationStyle: 'fullscreen' });
      } else {
        window.location.href = data.url;
      }
      return;
    }
    showLoading(false);
    showMessage('error', 'Apple sign-in did not open. Please try again.');
  } catch(e) {
    showLoading(false);
    showMessage('error', 'Apple sign-in failed. Please try email/password.');
  } finally {
    setTimeout(() => { handleAppleAuth._busy = false; }, 1200);
  }
}
async function handleLogin(event){
  event.preventDefault();
  clearMessage();
  toggleResendConfirm(false);
  const email = el('login-email').value.trim();
  const password = el('login-password').value;
  const btn = el('login-button');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  btn.textContent = 'Sign in to RAVEN';
  if (error) {
    const isUnconfirmed = (error.message || '').toLowerCase().includes('confirm');
    if (isUnconfirmed) {
      pendingConfirmEmail = email;
      showMessage('error', 'Please confirm your email first.');
      toggleResendConfirm(true);
      return;
    }
    return showMessage('error', error.message);
  }
  if (el('remember-email').checked) localStorage.setItem('raven_remembered_email', email);
  else localStorage.removeItem('raven_remembered_email');
  markRavenSignedIn();
  localStorage.setItem('raven_app_dashboard_email', email);
  if (data?.user) routeAfterAuth(data.user);
}
async function resendConfirmationEmail(){
  clearMessage();
  const email = (pendingConfirmEmail || el('login-email').value || '').trim();
  if (!email) return showMessage('error', 'Enter your email first.');
  const btn = el('resend-confirm-button');
  btn.disabled = true;
  btn.textContent = 'Sending confirmation...';
  const { error } = await db.auth.resend({
    type: 'signup',
    email,
    options: { emailRedirectTo: getAppConfirmRedirectTo() }
  });
  btn.disabled = false;
  btn.textContent = 'Resend confirmation email';
  if (error) return showMessage('error', error.message);
  showMessage('success', 'Confirmation email sent. Check your inbox and spam folder.');
}
async function handleSignup(event){
  event.preventDefault();
  clearMessage();
  const first = el('signup-first').value.trim();
  const email = el('signup-email').value.trim();
  const password = el('signup-password').value;
  if (password.length < 6) return showMessage('error','Password must be at least 6 characters.');
  const btn = el('signup-button');
  btn.disabled = true;
  btn.textContent = 'Creating...';
  markFreshAuthStart(RAVEN_SIGNUP_AUTH_KEY);
  let ravenId = '';
  try { ravenId = await generateUniqueRavenId(first || 'raven'); } catch(e) {}
  if (isNativeAppMode()) {
    try {
      const response = await fetch(BACKEND + '/auth/app-signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          firstName: first,
          email,
          password,
          redirectTo: getAppConfirmRedirectTo()
        })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.success) throw new Error(payload.error || 'Could not create account.');
      btn.disabled = false;
      btn.textContent = 'Create account';
      pendingConfirmEmail = email;
      el('login-email').value = email;
      if (payload.confirmed) {
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        const { data: loginData, error: loginError } = await db.auth.signInWithPassword({ email, password });
        btn.disabled = false;
        btn.textContent = 'Create account';
        if (loginError) throw loginError;
        markRavenSignedIn();
        localStorage.setItem('raven_app_dashboard_email', email);
        if (loginData?.user) {
          routeAfterAuth(loginData.user);
          return;
        }
      }
      showEmailConfirmationPanel(email);
      return;
      } catch(e) {
      clearFreshAuthStart();
      btn.disabled = false;
      btn.textContent = 'Create account';
      return showMessage('error', e.message || 'Could not send confirmation email. Please try again.');
    }
  }
  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: getAppConfirmRedirectTo(),
      data: { first_name: first, raven_id: ravenId, username: ravenId }
    }
  });
  if (error) {
    clearFreshAuthStart();
    btn.disabled = false;
    btn.textContent = 'Create account';
    if ((error.message || '').toLowerCase().includes('registered')) {
      pendingConfirmEmail = email;
      el('login-email').value = email;
      toggleResendConfirm(true);
    }
    return showMessage('error', error.message);
  }
  if (data?.user) {
    markRavenSignedIn();
    try {
      await db.from('profiles').upsert({
        id: data.user.id,
        email,
        first_name: first,
        raven_id: ravenId || await generateUniqueRavenId(first || 'raven', data.user.id),
        username: ravenId,
        onboarding_complete: true,
        updated_at: new Date().toISOString()
      }, { onConflict: 'id' });
    } catch(e) {}
  }
  btn.disabled = false;
  btn.textContent = 'Create account';
  if (data?.session?.user) {
    routeAfterAuth(data.session.user);
    return;
  }
  pendingConfirmEmail = email;
  showTab('login');
  el('login-email').value = email;
  toggleResendConfirm(true);
  showMessage('success','Account created. Check your email to confirm, then sign in here.');
}
async function handleReset(event){
  event.preventDefault();
  clearMessage();
  const email = el('reset-email').value.trim();
  const btn = el('reset-button');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  const redirectTo = getAppPasswordResetRedirectTo();
  let error = null;
  try {
    const resp = await fetch(BACKEND + '/auth/app-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, redirectTo })
    });
    const payload = await resp.json().catch(() => ({}));
    if (!resp.ok || payload.success === false) throw new Error(payload.error || 'Could not send reset link.');
  } catch(e) {
    error = e;
  }
  btn.disabled = false;
  btn.textContent = 'Send reset link';
  if (error) return showMessage('error', error.message || 'Could not send reset link.');
  showMessage('success','Reset link sent. Check your inbox.');
}
async function handleSetNewPassword(event){
  event.preventDefault();
  clearMessage();
  const pw = el('new-password-input').value.trim();
  if (!pw || pw.length < 6) return showMessage('error','Password must be at least 6 characters.');
  const btn = el('new-password-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  const { error } = await db.auth.updateUser({ password: pw });
  btn.disabled = false;
  btn.textContent = 'Set New Password';
  if (error) return showMessage('error', error.message);
  showMessage('success','Password updated! Signing you in...');
  setTimeout(() => {
    const { data: { session } } = db.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        markRavenSignedIn();
        routeAfterAuth(session.user);
      }
    });
  }, 1200);
}

(function(){
  document.addEventListener('DOMContentLoaded', function(){
    function captureScanTap(e) {
      const target = e.target && e.target.closest ? e.target.closest('#home-logo-btn,.scan-logo-button') : null;
      if (!target) return;
      e.preventDefault();
      e.stopPropagation();
      if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
      window.scanLogoAction({ preventDefault(){}, stopPropagation(){}, currentTarget: target, target });
    }
    function blockLogoSelection(e) {
      const target = e.target && e.target.closest ? e.target.closest('#home-logo-btn,.scan-logo-button') : null;
      if (!target) return;
      e.preventDefault();
    }
    document.addEventListener('touchstart', captureScanTap, { capture: true, passive: false });
    document.addEventListener('pointerdown', captureScanTap, true);
    document.addEventListener('mousedown', captureScanTap, true);
    document.addEventListener('click', captureScanTap, true);
    document.addEventListener('touchend', captureScanTap, { capture: true, passive: false });
    document.addEventListener('pointerup', captureScanTap, true);
    document.addEventListener('contextmenu', blockLogoSelection, true);
    document.addEventListener('selectstart', blockLogoSelection, true);
    const logoBtn = document.getElementById('home-logo-btn');
    if (!logoBtn) return;
    logoBtn.addEventListener('click', function(e){
      window.scanLogoAction(e);
    });
    logoBtn.addEventListener('touchend', function(e){
      window.scanLogoAction(e);
    }, { passive: false });
    const scanBtn = document.querySelector('.scan-logo-button');
    if (scanBtn) {
      scanBtn.addEventListener('pointerup', function(e){
        window.scanLogoAction(e);
      });
    }
  });
})();

(async function init(){
  localStorage.setItem('raven_native_app','1');
  // Fade-in on initial render
  requestAnimationFrame(() => document.body.classList.add('ready'));
  const remembered = localStorage.getItem('raven_remembered_email') || '';
  if (remembered) {
    el('login-email').value = remembered;
    el('remember-email').checked = true;
  }
  const hash = window.location.hash;
  const params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    const desc = params.get('error_description') || params.get('error') || 'Sign-in failed.';
    try { history.replaceState(null, '', window.location.pathname + '?app=1'); } catch(e) {}
    showSignedOutHome();
    showAuthPanel('login');
    showMessage('error', decodeURIComponent(desc.replace(/\+/g, ' ')));
    return;
  }
  if (params.get('signed_out') === '1') {
    clearRavenSignedInCache();
    try { history.replaceState(null, '', window.location.pathname + '?app=1'); } catch(e) {}
  }
  if (params.get('code') || (hash && hash.includes('access_token='))) {
    try { localStorage.removeItem(RAVEN_SIGNED_OUT_KEY); } catch(e) {}
  }
  if (params.get('from') === 'trip') {
    window.location.replace('dashboard.html?app=1&page=overview');
    return;
  }
  const isPasswordReset = params.get('reset') === '1' || params.get('type') === 'recovery' || (hash && hash.includes('type=recovery'));
  if (isPasswordReset && await preparePasswordResetFromUrl(window.location.href)) return;
  if (hash && hash.includes('access_token=')) {
    let session = await consumeImplicitAuthFromUrl();
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        const result = await db.auth.getSession();
        session = session || result?.data?.session || null;
      } catch(_) {}
      if (session?.user) break;
      await new Promise(resolve => setTimeout(resolve, 250));
    }
    history.replaceState(null, '', window.location.pathname + '?app=1');
    if (session?.user) {
      markRavenSignedIn();
      routeAfterAuth(session.user);
      return;
    }
  }
  if (params.get('code') && !isPasswordReset) {
    try {
      const { data, error } = await db.auth.exchangeCodeForSession(params.get('code'));
      if (error) throw error;
      history.replaceState(null, '', window.location.pathname + '?app=1');
      if (data?.session?.user) {
        markRavenSignedIn();
        routeAfterAuth(data.session.user);
        return;
      }
    } catch(e) {
      let session = null;
      for (let attempt = 0; attempt < 4; attempt++) {
        try {
          const result = await db.auth.getSession();
          session = result?.data?.session || null;
        } catch(_) {}
        if (session?.user) break;
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      history.replaceState(null, '', window.location.pathname + '?app=1');
      if (session?.user) {
        markRavenSignedIn();
        routeAfterAuth(session.user);
        return;
      }
      showSignedOutHome();
      showAuthPanel('login');
      showMessage('error', 'Google sign-in could not finish in Safari. Please use email sign-in for now.');
      return;
    }
  }
  if (hash && hash.includes('access_token')) {
    try { await consumeImplicitAuthFromUrl(); } catch(e) {}
    try { await db.auth.getSession(); } catch(e) {}
    // Check if this is a password recovery redirect
    if (isPasswordReset) {
      history.replaceState(null, '', window.location.pathname + '?app=1');
      // Show new-password form
      showSignedOutHome();
      showTab('new-password');
      return;
    }
    history.replaceState(null, '', window.location.pathname);
  }
  if (isPasswordReset) {
    try { await db.auth.getSession(); } catch(e) {}
    history.replaceState(null, '', window.location.pathname + '?app=1');
    showSignedOutHome();
    showTab('new-password');
    return;
  }
  if (isRavenSignedOut()) {
    await enforceAppSignedOut();
    return;
  }
  let session = null;
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const result = await db.auth.getSession();
      session = result?.data?.session || null;
    } catch(e) {}
    if (session?.user) break;
    await new Promise(resolve => setTimeout(resolve, 250));
  }
  if (session?.user) {
    // If session exists but it's a recovery session, show password form
    const urlHash = window.location.hash || '';
    markRavenSignedIn();
    routeAfterAuth(session.user);
  } else {
    showSignedOutHome();
  }
})();

setTimeout(() => {
  try {
    const loading = el('loading')?.classList.contains('show');
    const homeVisible = el('app-home')?.classList.contains('active');
