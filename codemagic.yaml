workflows:
  raven-ios:
    name: RAVEN iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - raven-ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ravensplit.app
      vars:
        APP_ID: com.ravensplit.app
        APP_NAME: RAVEN
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20.19.0
      xcode: 16.4

    scripts:
      - name: Install Node & npm dependencies
        script: |
          set -e
          echo "PWD: $(pwd)"
          ls -la
          node -v
          npm -v
          cat package.json
          npm install
        working_directory: .

      - name: Stage web assets for Capacitor
        script: |
          set -e
          rm -rf dist
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude dist \
            --exclude ios \
            --exclude node_modules \
            --exclude .git \
            --exclude codemagic \
            --exclude "package*.json" \
            --exclude "proxy*.js" \
            --exclude "server*.js" \
            --exclude README.md
          cp app.html dist/index.html
          ls -la dist
        working_directory: .

      - name: Initialize Capacitor iOS
        script: |
          set -e
          echo "PWD: $(pwd)"
          ls -la
          node -v
          npm -v
          npx cap add ios || true
          npx cap sync ios
        working_directory: .

      - name: Configure iOS deep links
        script: |
          set -e
          INFO_PLIST="ios/App/App/Info.plist"
          ENTITLEMENTS_PATH="ios/App/App/App.entitlements"
          PBXPROJ_PATH="ios/App/App.xcodeproj/project.pbxproj"

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.ravensplit.app" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ravensplit" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string com.ravensplit.app" "$INFO_PLIST"

          if [ "${ENABLE_ASSOCIATED_DOMAINS:-0}" != "1" ]; then
            echo "Skipping Associated Domains entitlement. Set ENABLE_ASSOCIATED_DOMAINS=1 after the Apple App ID and provisioning profile include Associated Domains."
            rm -f "$ENTITLEMENTS_PATH"
            ruby - "$PBXPROJ_PATH" <<'RUBY'
          path = ARGV.fetch(0)
          text = File.read(path)
          text.gsub!(/\n\s*CODE_SIGN_ENTITLEMENTS = App\/App\.entitlements;/, '')
          File.write(path, text)
          RUBY
            plutil -lint "$INFO_PLIST"
            exit 0
          fi

          mkdir -p "$(dirname "$ENTITLEMENTS_PATH")"
          cat > "$ENTITLEMENTS_PATH" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:ravensplit.com</string>
              <string>applinks:www.ravensplit.com</string>
            </array>
          </dict>
          </plist>
          PLIST

          ruby - "$PBXPROJ_PATH" <<'RUBY'
          path = ARGV.fetch(0)
          text = File.read(path)
          text.gsub!(/CODE_SIGN_ENTITLEMENTS = [^;]+;/, 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;')
          unless text.include?('CODE_SIGN_ENTITLEMENTS = App/App.entitlements;')
            text.gsub!(/(PRODUCT_BUNDLE_IDENTIFIER = com\.ravensplit\.app;\n)/, "\\1\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n")
          end
          File.write(path, text)
          RUBY

          grep -n "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ_PATH"
          plutil -lint "$ENTITLEMENTS_PATH"
        working_directory: .

      - name: Generate iOS app icons
        script: |
          set -e

          ICON_SOURCE="$CM_BUILD_DIR/icon-1024.png"
          ICON_SET="$CM_BUILD_DIR/ios/App/App/Assets.xcassets/AppIcon.appiconset"

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "Missing app icon source: $ICON_SOURCE"
            exit 1
          fi

          mkdir -p "$ICON_SET"

          create_icon() {
            local size="$1"
            local filename="$2"
            sips -z "$size" "$size" "$ICON_SOURCE" --out "$ICON_SET/$filename"
          }

          create_icon 20 AppIcon-20.png
          create_icon 40 AppIcon-20@2x.png
          create_icon 60 AppIcon-20@3x.png
          create_icon 29 AppIcon-29.png
          create_icon 58 AppIcon-29@2x.png
          create_icon 87 AppIcon-29@3x.png
          create_icon 40 AppIcon-40.png
          create_icon 80 AppIcon-40@2x.png
          create_icon 120 AppIcon-40@3x.png
          create_icon 120 AppIcon-60@2x.png
          create_icon 180 AppIcon-60@3x.png
          create_icon 76 AppIcon-76.png
          create_icon 152 AppIcon-76@2x.png
          create_icon 167 AppIcon-83.5@2x.png
          create_icon 1024 AppIcon-1024.png

          cat > "$ICON_SET/Contents.json" <<'JSON'
          {
            "images": [
              { "size": "20x20", "idiom": "iphone", "filename": "AppIcon-20@2x.png", "scale": "2x" },
              { "size": "20x20", "idiom": "iphone", "filename": "AppIcon-20@3x.png", "scale": "3x" },
              { "size": "29x29", "idiom": "iphone", "filename": "AppIcon-29@2x.png", "scale": "2x" },
              { "size": "29x29", "idiom": "iphone", "filename": "AppIcon-29@3x.png", "scale": "3x" },
              { "size": "40x40", "idiom": "iphone", "filename": "AppIcon-40@2x.png", "scale": "2x" },
              { "size": "40x40", "idiom": "iphone", "filename": "AppIcon-40@3x.png", "scale": "3x" },
              { "size": "60x60", "idiom": "iphone", "filename": "AppIcon-60@2x.png", "scale": "2x" },
              { "size": "60x60", "idiom": "iphone", "filename": "AppIcon-60@3x.png", "scale": "3x" },
              { "size": "20x20", "idiom": "ipad", "filename": "AppIcon-20.png", "scale": "1x" },
              { "size": "20x20", "idiom": "ipad", "filename": "AppIcon-20@2x.png", "scale": "2x" },
              { "size": "29x29", "idiom": "ipad", "filename": "AppIcon-29.png", "scale": "1x" },
              { "size": "29x29", "idiom": "ipad", "filename": "AppIcon-29@2x.png", "scale": "2x" },
              { "size": "40x40", "idiom": "ipad", "filename": "AppIcon-40.png", "scale": "1x" },
              { "size": "40x40", "idiom": "ipad", "filename": "AppIcon-40@2x.png", "scale": "2x" },
              { "size": "76x76", "idiom": "ipad", "filename": "AppIcon-76.png", "scale": "1x" },
              { "size": "76x76", "idiom": "ipad", "filename": "AppIcon-76@2x.png", "scale": "2x" },
              { "size": "83.5x83.5", "idiom": "ipad", "filename": "AppIcon-83.5@2x.png", "scale": "2x" },
              { "size": "1024x1024", "idiom": "ios-marketing", "filename": "AppIcon-1024.png", "scale": "1x" }
            ],
            "info": {
              "version": 1,
              "author": "xcode"
            }
          }
          JSON

          ls -la "$ICON_SET"
        working_directory: .

      - name: Install CocoaPods dependencies
        script: |
          set -e
          pod install
          ls -la
        working_directory: ios/App

      - name: Set up code signing settings on Xcode project
        script: |
          set -e
          xcode-project use-profiles --project "$XCODE_PROJECT"
          ls -la /Users/builder
        working_directory: .

      - name: Set app version
        script: |
          set -e

          ASC_LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_ID" 2>/dev/null || true)
          if ! [[ "$ASC_LATEST_BUILD" =~ ^[0-9]+$ ]]; then
            ASC_LATEST_BUILD=0
          fi

          CI_BUILD_NUMBER="${BUILD_NUMBER:-1}"
          if ! [[ "$CI_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            CI_BUILD_NUMBER=1
          fi

          IOS_BUILD_OFFSET="${IOS_BUILD_OFFSET:-285}"
          if ! [[ "$IOS_BUILD_OFFSET" =~ ^[0-9]+$ ]]; then
            IOS_BUILD_OFFSET=232
          fi

          APP_BUILD_NUMBER=$((ASC_LATEST_BUILD + 1))
          OFFSET_BUILD_NUMBER=$((IOS_BUILD_OFFSET + CI_BUILD_NUMBER))
          if [ "$CI_BUILD_NUMBER" -gt "$APP_BUILD_NUMBER" ]; then
            APP_BUILD_NUMBER="$CI_BUILD_NUMBER"
          fi
          if [ "$OFFSET_BUILD_NUMBER" -gt "$APP_BUILD_NUMBER" ]; then
            APP_BUILD_NUMBER="$OFFSET_BUILD_NUMBER"
          fi

          echo "App Store latest build number: $ASC_LATEST_BUILD"
          echo "Codemagic build number: $CI_BUILD_NUMBER"
          echo "iOS build offset: $IOS_BUILD_OFFSET"
          echo "Using iOS build number: $APP_BUILD_NUMBER"

          agvtool new-version -all "$APP_BUILD_NUMBER"
          agvtool new-marketing-version 1.0.0
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD_NUMBER" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription RAVEN uses your camera to scan receipt photos." App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string RAVEN uses your camera to scan receipt photos." App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription RAVEN uses your photo library so you can choose receipt photos." App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string RAVEN uses your photo library so you can choose receipt photos." App/Info.plist
        working_directory: ios/App

      - name: Build iOS IPA
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist || {
              echo "xcode-project build-ipa failed. Recent xcodebuild logs:"
              find /tmp/xcodebuild_logs -type f -maxdepth 1 -print -exec tail -n 220 {} \; 2>/dev/null || true
              exit 1
            }
        working_directory: .

      - name: Upload to TestFlight via xcrun altool
        script: |
          set -e
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # Write the API key .p8 from env var (base64-encoded)
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose
        working_directory: .

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
